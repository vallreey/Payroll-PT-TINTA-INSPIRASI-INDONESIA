
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-app
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - payroll-network

  db:
    image: mysql:8.4
    container_name: payroll-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: payroll-tintainspirasi
      MYSQL_USER: payroll_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - payroll_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - payroll-network

volumes:
  payroll_mysql_data:

networks:
  payroll-network:
    driver: bridge
